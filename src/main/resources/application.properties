spring.application.name=tutoringappointments
spring.config.import=optional:file:.env[.properties]
server.port=8062
debug=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tutoringdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
server.error.include-stacktrace=never

notification.url=${NOTIFICATION_URL:http://localhost:${server.port}/mock/notifications}
notification.timeout-ms=500
notification.attempts=3
notification.retry-delay-ms=100
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3

# Optional until a Gemini Developer API key is supplied. Never put a real key here.
ai.enabled=${AI_ENABLED:false}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
ai.chat-model=${GEMINI_MODEL:gemini-4-hydrogen}
ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
ai.reminders.enabled=${AI_REMINDERS_ENABLED:false}
ai.reminders.delay-ms=60000
